apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: dev
spec:
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: akshaydevops0504/two-tier-welcome-app:03
        ports:
        - containerPort: 3306
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: "RootDbPass123!"
        - name: MYSQL_DATABASE
          value: "welcome_app"
        - name: MYSQL_USER
          value: "appuser"
        - name: MYSQL_PASSWORD
          value: "dbuser"
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
    volumes:
    - name: mysql-data
      emptyDir: {}
